name: Build and Publish DeleteMe APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: deleteme-android-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main source
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Integrate generated Android navigation
        run: python scripts/ensure_trai_navigation.py

      - name: Integrate SIGIT username reconnaissance
        run: python scripts/ensure_sigit_username.py

      - name: Verify SIGIT integration is present
        run: |
          set -euo pipefail
          test -s android/app/src/main/java/com/rath0darya/deleteme/SigitUserRecon.java
          grep -q 'SigitUserRecon.scan' android/app/src/main/java/com/rath0darya/deleteme/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.4.1'

      - name: Validate Android project
        working-directory: android
        run: gradle :app:check --no-daemon --warning-mode=all

      - name: Build latest debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --warning-mode=all

      - name: Verify APK output
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK size: $(du -h "$APK" | cut -f1)"
          sha256sum "$APK"

      - name: Verify APK contains SIGIT integration
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" | grep -q 'classes.dex'
          echo "APK contains compiled Android classes."

      - name: Replace permanent APK in repository
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/DeleteMe.apk
          sha256sum downloads/DeleteMe.apk > downloads/DeleteMe.apk.sha256

      - name: Publish source and APK to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/rath0darya/deleteme/MainActivity.java android/app/src/main/java/com/rath0darya/deleteme/SigitUserRecon.java scripts/ensure_sigit_username.py downloads/DeleteMe.apk downloads/DeleteMe.apk.sha256
          if git diff --cached --quiet; then
            echo "No generated source or APK changes to publish"
            exit 0
          fi
          git commit -m "Build and publish latest DeleteMe APK [skip ci]"
          git push origin main

      - name: Remove previous APK artifact
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            for (const artifact of artifacts.filter(item => item.name === 'DeleteMe-debug-apk')) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }

      - name: Upload latest APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: DeleteMe-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
