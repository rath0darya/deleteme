name: Build and Publish DeleteMe APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: deleteme-android-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.4.1'

      - name: Validate Android project
        working-directory: android
        run: gradle :app:check --no-daemon

      - name: Build latest debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK output
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK size: $(du -h android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)"

      - name: Replace permanent APK in repository
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/DeleteMe.apk
          sha256sum downloads/DeleteMe.apk > downloads/DeleteMe.apk.sha256

      - name: Publish APK and checksum to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/DeleteMe.apk downloads/DeleteMe.apk.sha256
          if git diff --cached --quiet; then
            echo "Published APK is already identical to this build"
            exit 0
          fi
          git commit -m "Build and publish latest DeleteMe APK"
          git push origin main

      - name: Remove previous APK artifact
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            for (const a of artifacts.filter(x => x.name === 'DeleteMe-debug-apk')) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: a.id
              });
            }

      - name: Upload latest APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeleteMe-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
