name: Finalize location permission UI

on:
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/java/**'
      - 'android/app/src/main/res/layout/screen_scan.xml'
      - 'android/app/src/main/AndroidManifest.xml'
      - '.github/workflows/location-ui-patch.yml'

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Make location permission user-initiated') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make location permission user-initiated
        shell: python
        run: |
          from pathlib import Path
          p = Path('android/app/src/main/java/com/rath0darya/deleteme/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          old = 'updateLocationUi();requestLocationIfNeeded();'
          new = 'updateLocationUi();'
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          elif 'updateLocationUi();' not in s:
              raise SystemExit('Expected location UI call was not found')

      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/location-ui-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/rath0darya/deleteme/MainActivity.java .github/workflows/location-ui-patch.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Make location permission user-initiated'
          git push
