name: Publish DeleteMe APK

on:
  workflow_run:
    workflows: ["Build DeleteMe APK"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: DeleteMe-debug-apk
          path: apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}

      - name: Publish permanent APK
        run: |
          mkdir -p downloads
          cp apk/app-debug.apk downloads/DeleteMe.apk
          sha256sum downloads/DeleteMe.apk > downloads/DeleteMe.apk.sha256

      - name: Commit APK to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/DeleteMe.apk downloads/DeleteMe.apk.sha256
          if git diff --cached --quiet; then
            echo "APK is already current"
            exit 0
          fi
          git commit -m "Publish DeleteMe APK"
          git push origin main
